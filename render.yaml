# Render Blueprint specification for TalentForge
# Docs: https://render.com/docs/blueprint-spec

services:
  # 1. Express API Backend (Web Service)
  - type: web
    name: talentforge-backend
    runtime: node
    plan: free
    buildCommand: rm -rf package-lock.json node_modules && npm install --include=dev && npm run build:backend
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: talentforge-db
          property: connectionString
      - key: CORS_ORIGIN
        value: "*"

  # 2. React + Vite Frontend (Static Site)
  - type: web
    name: talentforge-frontend
    runtime: static
    buildCommand: rm -rf package-lock.json node_modules && npm install --include=dev && npm run build:frontend
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_API_URL
        fromService:
          type: web
          name: talentforge-backend
          property: host

databases:
  # 3. Managed PostgreSQL Database
  - name: talentforge-db
    databaseName: talentforge
    user: talentforge_user
    plan: free
